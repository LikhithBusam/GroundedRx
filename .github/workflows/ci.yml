name: CI

# Fast, CPU-only checks on every push/PR -- no GPU, no model downloads, no
# vector store needed. This deliberately does NOT run the notebook itself
# (Setup/Component 4/5/6 all require a CUDA GPU) -- see CLAUDE.md. What it
# does verify: the groundedrx package installs and its pure/CPU-testable
# logic behaves correctly, the code lints clean, and the notebook's cells
# still parse as valid Python after any edit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (core + dev, no GPU extras)
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check groundedrx/ tests/ scripts/

      - name: Pytest (CPU-only suite)
        run: pytest tests/ -v

      - name: Notebook cells still parse as valid Python
        run: python scripts/check_notebook.py
