name: CI

# Fast, CPU-only checks on every push/PR -- no GPU, no model downloads, no
# vector store needed. This deliberately does NOT run the notebook itself
# (Setup/Component 4/5/6 all require a CUDA GPU) -- see CLAUDE.md. What it
# does verify: the groundedrx package installs and its pure/CPU-testable
# logic behaves correctly (including the FastAPI wiring, pipeline mocked),
# the code lints clean, the notebook's cells still parse as valid Python,
# and the on-premises Docker image actually builds.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (core + dev + api extras, no GPU extras)
        run: pip install -e ".[dev,api]"

      - name: Ruff lint
        run: ruff check groundedrx/ tests/ scripts/

      - name: Pytest (CPU-only suite)
        run: pytest tests/ -v

      - name: Notebook cells still parse as valid Python
        run: python scripts/check_notebook.py

  docker-build:
    # Proves the on-premises image builds cleanly -- does NOT run it (that
    # needs a GPU + the mounted vector store, neither available on a GH
    # Actions runner). A build-only check is still real signal: it catches
    # a broken pyproject.toml, a missing file, or a bad RUN step before
    # anyone tries this on real GPU hardware.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: groundedrx:ci-build
          cache-from: type=gha
          cache-to: type=gha,mode=max
